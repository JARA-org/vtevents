name: my-little-gobbler
services:
  app:
    image: ${GOBBLER_IMAGE:-my-little-gobbler-app:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Compose >=2.30: preserve literal $ and # in secrets without interpolation.
    env_file:
      - path: ../.env.production
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: https://${GOBBLER_DOMAIN:?Set GOBBLER_DOMAIN to an owned hostname}
    expose: ["3000"]
    # Operator-owned credentials never enter the image or release bundle.
    # ANS_DIRECTORY=/run/gobbler-ans in the host env explicitly enables ANS.
    volumes:
      - /opt/gobbler-ans:/run/gobbler-ans:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      GOBBLER_DOMAIN: ${GOBBLER_DOMAIN:?Set GOBBLER_DOMAIN to an owned hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  caddy_data:
  caddy_config:
